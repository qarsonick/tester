<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вподобання | TechGreen</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">TECH<span>GREEN</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Головна</a></li>
                <li><a href="index.html" class="dropbtn" style="text-decoration:none">НАЗАД ДО МАГАЗИНУ</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2 class="section-title-center">ВАШІ ВПОДОБАННЯ</h2>
        <div id="likes-grid" class="products"></div>
    </main>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('likes-grid');
            let likes = JSON.parse(localStorage.getItem('likes')) || [];
            
            if (likes.length === 0) {
                grid.innerHTML = "<p class='empty-msg'>У списку вподобань поки порожньо...</p>";
                return;
            }

            grid.innerHTML = likes.map(p => `
                <div class="product-card">
                    <div class="product-img-wrapper">
                        <img src="${p.image}" class="product-img">
                    </div>
                    <div class="cat-tag">${p.cat}</div>
                    <h3>${p.name}</h3>
                    <p class="price">${p.price} грн</p>
                    
                    <button class="add-to-cart" style="margin-bottom: 10px;" onclick="addToCartFromLikes(${p.id})">
                        У КОШИК
                    </button>
                    
                    <button class="remove-btn" onclick="removeFromLikes(${p.id})">
                        ВИДАЛИТИ
                    </button>
                </div>
            `).join('');
        });

        window.addToCartFromLikes = function(id) {
            if (typeof addToCart === "function") {
                addToCart(id);
                alert("Товар додано до кошика!");
            }
        };

        window.removeFromLikes = function(id) {
            let likes = JSON.parse(localStorage.getItem('likes')) || [];
            likes = likes.filter(p => p.id !== id);
            localStorage.setItem('likes', JSON.stringify(likes));
            location.reload();
        };
    </script>
</body>
</html>
